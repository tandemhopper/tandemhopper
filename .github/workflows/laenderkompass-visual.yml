name: Länderkompass visual regression
on:
  pull_request:
    paths:
      - "app/**"
      - "components/**"
      - "lib/hongkongEditableDefaults.js"
      - "sanity/**"
      - "public/assets/laender/hongkong/**"
      - ".github/workflows/laenderkompass-visual.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshot-check:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install application and Playwright
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
      - name: Start Next.js on localhost
        run: |
          nohup npm run dev -- --hostname 127.0.0.1 --port 3000 > /tmp/next-dev.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3000/laender/hongkong > /dev/null; then
              echo "Ready"; exit 0
            fi
            sleep 2
          done
          tail -120 /tmp/next-dev.log
          exit 1
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Check page alignment and capture screenshots
        run: node scripts/check-hongkong-layout.cjs
      - name: Upload screenshots for visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laenderkompass-layout
          path: |
            test-results/layout/*.png
            test-results/layout/report.json
          retention-days: 7
