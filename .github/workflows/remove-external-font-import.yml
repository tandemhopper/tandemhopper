name: Remove external font import

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message == 'Run font cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove Google Fonts CSS import
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app/globals.css')
          text = path.read_text()
          lines = text.splitlines(True)
          if lines and 'fonts.googleapis.com' in lines[0]:
              text = ''.join(lines[1:])
              path.write_text(text)
          PY
      - name: Commit cleanup
        run: |
          git config user.name "tandemhopper"
          git config user.email "maximilian.dahlke@web.de"
          git add app/globals.css
          if ! git diff --cached --quiet; then
            git commit -m "Remove external Google Fonts import"
            git push
          fi
